<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depth of Field Images</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        h1, h2 {
            text-align: center;
        }
        .image-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        .image-container {
            text-align: center;
        }
        img {
            max-width: 400px;
            height: auto;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h1>Depth of Field Assignment</h1>

    <h2>Shallow Depth of Field (In-Camera)</h2>
    <div class="image-row">
        <div class="image-container">
            <p>Before Camera Raw</p>
            <img src="Images/image1_shallow-in-camera.jpg" alt="Shallow DoF Before">
        </div>
        <div class="image-container">
            <p>After Camera Raw</p>
            <img src="Images/image1_shallow-in-camera_after-raw.jpg" alt="Shallow DoF After">
        </div>
    </div>

    <h2>Deep Depth of Field (In-Camera)</h2>
    <div class="image-row">
        <div class="image-container">
            <p>Before Camera Raw</p>
            <img src="Images/image2_deep-in-camera.jpg" alt="Deep DoF Before">
        </div>
        <div class="image-container">
            <p>After Camera Raw</p>
            <img src="Images/image2_deep-in-camera_after-raw.jpg" alt="Deep DoF After">
        </div>
    </div>

    <h2>Field Blur (Photoshop)</h2>
    <div class="image-row">
        <div class="image-container">
            <p>Before Field Blur</p>
            <img src="Images/image3_field-blur-before.jpg" alt="Field Blur Before">
        </div>
        <div class="image-container">
            <p>After Field Blur</p>
            <img src="Images/image3_field-blur-after.jpg" alt="Field Blur After">
        </div>
    </div>

    <p style="text-align:center;"><a href="index.html">Back to Homepage</a></p>
</body>
</html
